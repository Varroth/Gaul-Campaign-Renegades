name: Repository integrity (pull requests)
on:
  pull_request:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify revisions across the full pull request
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python scripts/sync_new_recruit_revisions.py --base "$BASE" --check
      - name: Check catalogues, manifest and regression tests
        run: |
          python scripts/check_repository.py --check-manifest
          python scripts/audit_new_recruit.py
          python scripts/audit_frozen_cogs_roster.py
          python tools/qc_frozen_cogs.py
          python -m unittest discover -s tests -v
