name: Publish Frozen Cogs integrated catalogue
on:
  push:
    branches: [main]
    paths:
      - 'integration_payload/frozen-cogs-v2.3.tar.xz.base64'
      - '.github/workflows/publish-frozen-cogs.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: frozen-cogs-publish-main
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'Varroth/Gaul-Campaign-Renegades'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Verify archive and publish the complete Frozen Cogs faction
        shell: bash
        run: |
          python3 - <<'PY'
          import base64, hashlib, io, lzma, re, tarfile
          import xml.etree.ElementTree as ET
          from pathlib import Path

          encoded = Path("integration_payload/frozen-cogs-v2.3.tar.xz.base64").read_text().strip()
          archive_data = lzma.decompress(base64.b64decode(encoded))
          with tarfile.open(fileobj=io.BytesIO(archive_data), mode="r:") as archive:
              def item(name):
                  member = archive.extractfile(name)
                  assert member is not None, "Missing file " + name
                  return member.read()
              cat = item("Frozen_Cogs.cat")
              gst = item("Gaul_Campaign_Renegades.gst")
              notes = item("FROZEN_COGS_RELEASE_NOTES_v2_3.md")

          expected = {
              "Frozen_Cogs.cat": "6b5d9653fc8e030dff9dc1a2281d5056cb217caa29605d8aad6c1ff8ef8b54ee",
              "Gaul_Campaign_Renegades.gst": "b092b10a4d49c370b9c961782d8db468084623a7a901afe0fca963f9f478a615",
          }
          for name, data in [("Frozen_Cogs.cat", cat), ("Gaul_Campaign_Renegades.gst", gst)]:
              assert hashlib.sha256(data).hexdigest() == expected[name], "Hash mismatch: " + name

          old = ET.parse("Gaul_Campaign_Renegades.gst").getroot()
          assert old.attrib["id"] == "0408-b3dc-97f0-53dc", "Unexpected game-system ID"
          assert old.attrib["revision"] == "7", "Unexpected old revision, rebase integration first"
          old_names = {x.attrib["name"] for x in old.findall("{*}forceEntries/{*}forceEntry")}
          assert "Infernal Warriors Muster" in old_names and "Abandoned Dead Task Force" in old_names
          assert "Frozen Cogs Expeditionary Force" not in old_names
          original = Path("Frozen_Cogs_FUTURE.cat")
          assert original.is_file(), "Expected original placeholder missing"
          original_root = ET.parse(original).getroot()
          assert original_root.attrib["id"] == "9a0b2133-696e-5c99"

          new_gst = ET.fromstring(gst)
          new_cat = ET.fromstring(cat)
          assert new_gst.attrib["revision"] == "8"
          assert new_cat.attrib["name"] == "Frozen Cogs"
          assert new_cat.attrib["gameSystemId"] == new_gst.attrib["id"]
          assert new_cat.attrib["gameSystemRevision"] == "8"
          assert new_cat.attrib["id"] == original_root.attrib["id"]
          assert len(new_cat.findall("{*}selectionEntries/{*}selectionEntry")) == 164
          new_names = {x.attrib["name"] for x in new_gst.findall("{*}forceEntries/{*}forceEntry")}
          assert old_names.issubset(new_names)
          assert "Frozen Cogs Expeditionary Force" in new_names

          Path("Gaul_Campaign_Renegades.gst").write_bytes(gst)
          Path("Frozen_Cogs.cat").write_bytes(cat)
          Path("FROZEN_COGS_RELEASE_NOTES_v2_3.md").write_bytes(notes)
          original.unlink()

          # Every surviving catalogue must reference the new shared system revision.
          # Revision counters are advanced so New Recruit can detect the update.
          for path in Path(".").glob("*.cat"):
              if path.name == "Frozen_Cogs.cat":
                  continue
              current = path.read_text(encoding="utf-8")
              match = re.search(r"<catalogue\b[^>]*>", current)
              assert match, "Bad catalogue root: " + path.name
              tag = match.group()
              m = re.search(r'\brevision="(\d+)"', tag)
              sysrev = re.search(r'\bgameSystemRevision="(\d+)"', tag)
              assert m and sysrev and sysrev.group(1) == "7", "Unexpected catalog revision: " + path.name
              new_tag = tag[:]
              new_tag = re.sub(r'\brevision="\d+"', 'revision="' + str(int(m.group(1)) + 1) + '"', new_tag, count=1)
              new_tag = re.sub(r'\bgameSystemRevision="\d+"', 'gameSystemRevision="8"', new_tag, count=1)
              path.write_text(current[:match.start()] + new_tag + current[match.end():], encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          readme = re.sub(r"^# Gaul Campaign: Renegades.*$", "# Gaul Campaign: Renegades — Infernal Warriors, Abandoned Dead & Frozen Cogs", readme, count=1, flags=re.M)
          readme = readme.replace(
              "Contains the playable Infernal Warriors and Abandoned Dead, plus clearly marked future placeholders for Frozen Cogs and Silver Tempest.",
              "Contains playable Infernal Warriors, Abandoned Dead and Frozen Cogs catalogues. Silver Tempest remains a future placeholder."
          )
          if "## Frozen Cogs v2.3" not in readme:
              readme += "\n## Frozen Cogs v2.3\n\nThe former in-development listing has been replaced by the playable **Frozen Cogs Expeditionary Force** (164 roster entries). See [Frozen Cogs release notes](FROZEN_COGS_RELEASE_NOTES_v2_3.md). Points remain provisional. Native New Recruit import and certain cross-unit weapon, Leader and transport restrictions require additional acceptance testing.\n"
          readme_path.write_text(readme, encoding="utf-8")

          system = ET.parse("Gaul_Campaign_Renegades.gst").getroot()
          for path in Path(".").glob("*.cat"):
              root = ET.parse(path).getroot()
              assert root.attrib["gameSystemId"] == system.attrib["id"], path
              assert root.attrib["gameSystemRevision"] == "8", path
          assert not Path("Frozen_Cogs_FUTURE.cat").exists()
          assert Path("Frozen_Cogs.cat").exists()
          print("Verified complete Frozen Cogs 164-entry publication; three playable factions preserved.")
          PY
      - name: Commit integrated catalogues
        shell: bash
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cat' '*.gst' README.md FROZEN_COGS_RELEASE_NOTES_v2_3.md
          git add -u Frozen_Cogs_FUTURE.cat
          if git diff --cached --quiet; then
            echo "No catalogue changes to publish"
          else
            git commit -m "feat: publish full Frozen Cogs faction and remove development placeholder"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
