name: Prepare Frozen Cogs New Recruit revision 18
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-frozen-cogs-r18.yml'
      - 'tools/prepare_frozen_cogs_r18.py'
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare revision 18
        run: python tools/prepare_frozen_cogs_r18.py
      - name: Verify catalogue XML
        run: python tools/qc_frozen_cogs.py
      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frozen_Cogs.cat
          if git diff --cached --quiet; then
            echo "Catalogue already up to date; no commit needed."
          else
            git commit -m "Frozen Cogs r18: publish New Recruit catalogue revision"
            git push origin HEAD:main
          fi
