name: Publish Frozen Cogs New Recruit r19 native quotas
on:
  push:
    branches: [main]
    paths:
      - 'tools/prepare_frozen_cogs_r19.py'
      - '.github/workflows/release-frozen-cogs-r19.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native New Recruit weapon quota catalogue
        run: python tools/prepare_frozen_cogs_r19.py
      - name: Verify XML, IDs, revision and squad definitions
        run: python tools/qc_frozen_cogs.py
      - name: Publish updated catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Frozen_Cogs.cat
          if git diff --cached --quiet; then
            echo "Catalogue already up to date"
          else
            git commit -m "Frozen Cogs r19: native New Recruit Tactical and Devastator quotas"
            git push origin HEAD:main
          fi
