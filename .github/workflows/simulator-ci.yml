name: Gaul Campaign Simulator Tests
on:
  push:
    branches: [main]
    paths:
      - 'simulator/**'
      - 'docs/simulator/**'
      - '.github/workflows/simulator-ci.yml'
  pull_request:
    paths:
      - 'simulator/**'
      - 'docs/simulator/**'
      - '.github/workflows/simulator-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator-tests:
    name: Browser engine and interface smoke tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript
        run: |
          node --check simulator/engine.js
          node --check simulator/app.js
      - name: Execute simulator regression suite
        run: node --test simulator/tests/*.test.cjs
