name: Validate and synchronize New Recruit revisions
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: new-recruit-revisions-main
  cancel-in-progress: false
jobs:
  validate-and-publish:
    if: github.repository == 'Varroth/Gaul-Campaign-Renegades'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Normalize revision metadata
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          python scripts/sync_new_recruit_revisions.py --base "${BEFORE:-HEAD^}"
      - name: Validate every catalogue and generate release manifest
        run: |
          python scripts/check_repository.py --write-manifest --report repository-qc.json
          python scripts/audit_new_recruit.py --report new-recruit-qc.json
          python scripts/audit_frozen_cogs_roster.py --report frozen-cogs-qc.json
          python tools/qc_frozen_cogs.py
          python -m unittest discover -s tests -v
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: repository-qc
          path: |
            repository-qc.json
            new-recruit-qc.json
            frozen-cogs-qc.json
          if-no-files-found: warn
      - name: Publish validated metadata only
        run: |
          git add -- '*.cat' '*.gst' catalogue-manifest.json
          if git diff --cached --quiet; then
            echo "All published metadata is current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: synchronize validated New Recruit metadata"
          # A normal fast-forward push fails safely if another author has pushed.
          # Never rebase already-validated XML onto untested changes.
          git push origin HEAD:main
