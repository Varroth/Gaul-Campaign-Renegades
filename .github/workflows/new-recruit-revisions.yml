name: Validate and synchronize New Recruit revisions
on:
  push:
    branches: [main]
    paths:
      - '**.gst'
      - '**.cat'
      - '.github/workflows/new-recruit-revisions.yml'
      - 'scripts/sync_new_recruit_revisions.py'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: new-recruit-revisions-main
  cancel-in-progress: false
jobs:
  normalize:
    if: github.repository == 'Varroth/Gaul-Campaign-Renegades'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          persist-credentials: true
      - name: Normalize catalogue revisions
        run: python3 scripts/sync_new_recruit_revisions.py
      - name: Validate XML and references
        run: |
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          root = ET.parse('Gaul_Campaign_Renegades.gst').getroot()
          sid, rev = root.attrib['id'], root.attrib['revision']
          for path in Path('.').glob('*.cat'):
              cat = ET.parse(path).getroot()
              assert cat.attrib['gameSystemId'] == sid, path
              assert cat.attrib['gameSystemRevision'] == rev, path
              assert int(cat.attrib['revision']) >= 1, path
              print(f"{path}: catalogue revision {cat.attrib['revision']}, system revision {rev}")
          PY
      - name: Commit metadata fixes if necessary
        run: |
          if ! git diff --quiet -- '*.cat' '*.gst'; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- '*.cat' '*.gst'
            git commit -m "chore: synchronize New Recruit catalogue revisions [skip ci]"
            git pull --rebase origin main
            git push
          fi
