name: Frozen Cogs catalogue integrity
on:
  push:
    paths:
      - 'Frozen_Cogs.cat'
      - 'Gaul_Campaign_Renegades.gst'
      - 'tools/qc_frozen_cogs.py'
      - 'tools/qc_frozen_cogs_roster.py'
      - 'tests/test_frozen_cogs_roster.py'
      - '.github/workflows/frozen-cogs-qc.yml'
  pull_request:
    paths:
      - 'Frozen_Cogs.cat'
      - 'Gaul_Campaign_Renegades.gst'
      - 'tools/qc_frozen_cogs.py'
      - '.github/workflows/frozen-cogs-qc.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Frozen Cogs XML and revision compatibility
        run: python tools/qc_frozen_cogs.py
      - name: Run exported-roster quota regression tests
        run: python -m unittest discover -s tests -p 'test_frozen_cogs_roster.py'
